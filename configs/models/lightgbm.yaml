models:
  - name: lightgbm
    seed: 42
    constructor:
      loss: mse
      learning_rate: 0.03
      num_leaves: 15
      max_depth: 4
      min_data_in_leaf: 100
      colsample_bytree: 0.8
      subsample: 0.8
      subsample_freq: 1
      lambda_l2: 10.0
      num_boost_round: 500
      early_stopping_rounds: 50
      num_threads: 4
      deterministic: true
      force_col_wise: true
